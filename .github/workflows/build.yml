name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      stress:
        description: Run the 100,000-file and 4 GiB ZIP64 tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build, test, and package
        env:
          RUN_STRESS: ${{ inputs.stress }}
        run: |
          $buildArguments = @{ Test = $true; Package = $true }
          if ($env:RUN_STRESS -eq 'true') { $buildArguments.Stress = $true }
          & ./build.ps1 @buildArguments
          if ($LASTEXITCODE -ne 0) { throw 'Build or tests failed.' }
      - name: Check English UI
        run: |
          & ./tests/OneFolderOneZip.UiTests/bin/Release/net10.0-windows/OneFolderOneZip.UiTests.exe --english
          if ($LASTEXITCODE -ne 0) { throw 'English UI tests failed.' }
      - name: Upload distribution package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 1Folder1Zip-win-x64
          path: artifacts/releases/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
